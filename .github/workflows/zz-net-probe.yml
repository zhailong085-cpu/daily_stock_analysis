name: net-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe free market data endpoints
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36'
          probe() {
            printf '%-30s ' "$1"
            curl -s -m 15 -o /tmp/b -w 'HTTP=%{http_code} t=%{time_total}s size=%{size_download} ' \
              -A "$UA" -e 'https://quote.eastmoney.com/' "$2"
            head -c 110 /tmp/b | tr -d '\n'; echo
          }
          probe 'EM ulist 指数成交额' 'https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&invt=2&secids=1.000001,0.399001&fields=f2,f3,f6,f12,f14'
          probe 'EM clist A股全市场' 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=100&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23&fields=f2,f3,f6,f12,f14'
          probe 'EM clist 港股全市场' 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=100&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:128+t:3,m:128+t:4,m:128+t:1,m:128+t:2&fields=f2,f3,f6,f12,f14'
          probe 'EM clist 美股全市场' 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=100&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:105,m:106,m:107&fields=f2,f3,f6,f12,f14'
          probe 'EM clist 行业板块榜' 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=50&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:2+f:!50&fields=f2,f3,f12,f14,f104,f105,f128'
          probe 'EM 82备用域名' 'https://82.push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5&fs=m:0+t:6&fields=f12,f14,f3'
          probe '新浪 hq.sinajs' 'https://hq.sinajs.cn/list=sh000001,sz399001'
          probe '腾讯 qt.gtimg' 'https://qt.gtimg.cn/q=sh000001,sz399001'
          probe 'TickFlow 免费服务器' 'https://free-api.tickflow.org/v1/instruments?symbols=600000.SH'
          echo "=== runner geo ==="
          curl -s -m 10 https://ipinfo.io/json | head -c 300; echo
