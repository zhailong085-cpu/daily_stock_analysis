name: net-probe2
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Deep probe
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36'
          E='https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&invt=2&secids=1.000001,0.399001&fields=f2,f3,f6,f12,f14'
          echo '=== 1) 东财 302 响应头 ==='
          curl -s -D - -o /dev/null -m 15 -A "$UA" -e 'https://quote.eastmoney.com/' "$E" | head -25
          echo '=== 2) 东财 -L 跟随重定向 ==='
          curl -sL -m 25 -o /tmp/e -w 'HTTP=%{http_code} final=%{url_effective} size=%{size_download}\n' -A "$UA" -e 'https://quote.eastmoney.com/' "$E"; head -c 250 /tmp/e; echo
          echo '=== 3) 东财备用域名 ==='
          for h in push2delay.eastmoney.com push2his.eastmoney.com push2.eastmoney.com datacenter-web.eastmoney.com; do
            printf '%-34s ' "$h"
            curl -sL -m 15 -o /tmp/x -w 'HTTP=%{http_code} t=%{time_total}s size=%{size_download} ' -A "$UA" -e 'https://quote.eastmoney.com/' "https://$h/api/qt/ulist.np/get?fltt=2&invt=2&secids=1.000001&fields=f2,f6,f12,f14"
            head -c 90 /tmp/x | tr -d '\n'; echo
          done
          echo '=== 4) 东财 http(非https) ==='
          curl -sL -m 15 -o /tmp/y -w 'HTTP=%{http_code} size=%{size_download} ' -A "$UA" 'http://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=1.000001&fields=f2,f6,f12,f14'; head -c 100 /tmp/y; echo
          echo '=== 5) 新浪正确 Referer ==='
          curl -s -m 15 -o /tmp/s -w 'HTTP=%{http_code} size=%{size_download} ' -A "$UA" -e 'https://finance.sina.com.cn/' 'https://hq.sinajs.cn/list=sh000001,sz399001'; head -c 150 /tmp/s; echo
          echo '=== 6) 腾讯 proxy 排行 sort_type 试探 ==='
          for st in PriceUpDown ChangePercent zdf price ChangeRate; do
            printf '%-16s ' "$st"
            curl -s -m 12 -o /tmp/p -w 'HTTP=%{http_code} size=%{size_download} ' -A "$UA" -e 'https://gu.qq.com/' "https://proxy.finance.qq.com/cgi/cgi-bin/rank/pt/getRank?board_type=hs&sort_type=$st&direct=down&offset=0&count=5"
            head -c 160 /tmp/p | tr -d '\n'; echo
          done
          echo '=== 7) 腾讯 港美股指数 ==='
          curl -s -m 15 -o /tmp/t -w 'HTTP=%{http_code} size=%{size_download} ' -A "$UA" -e 'https://gu.qq.com/' 'https://qt.gtimg.cn/q=hkHSI,hkHSCEI,usDJI,usIXIC,usINX'; iconv -f gbk -t utf-8 /tmp/t 2>/dev/null | head -c 400; echo
          echo '=== 8) 公共反代（免费）能否读东财 ==='
          for p in 'https://api.allorigins.win/raw?url=https%3A%2F%2Fpush2.eastmoney.com%2Fapi%2Fqt%2Fulist.np%2Fget%3Ffltt%3D2%26secids%3D1.000001%26fields%3Df2%2Cf6%2Cf12%2Cf14' 'https://corsproxy.io/?url=https%3A%2F%2Fpush2.eastmoney.com%2Fapi%2Fqt%2Fulist.np%2Fget%3Ffltt%3D2%26secids%3D1.000001%26fields%3Df2%2Cf6%2Cf12%2Cf14' 'https://r.jina.ai/https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=1.000001&fields=f2,f6,f12,f14'; do
            printf '%-22s ' "$(echo "$p" | cut -d/ -f3)"
            curl -sL -m 20 -o /tmp/z -w 'HTTP=%{http_code} t=%{time_total}s size=%{size_download} ' -A "$UA" "$p"
            head -c 130 /tmp/z | tr -d '\n'; echo
          done
          echo '=== 9) 海外免费源 ==='
          for u in 'https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1d&range=2d' 'https://stooq.com/q/d/l/?s=%5Espx&i=d' 'https://api.nasdaq.com/api/quote/AAPL/info?assetclass=stocks' 'https://free-api.tickflow.org/v1/instruments?symbols=600000.SH'; do
            printf '%-30s ' "$(echo "$u" | cut -d/ -f3)"
            curl -sL -m 15 -o /tmp/o -w 'HTTP=%{http_code} size=%{size_download} ' -A "$UA" "$u"; head -c 100 /tmp/o | tr -d '\n'; echo
          done
