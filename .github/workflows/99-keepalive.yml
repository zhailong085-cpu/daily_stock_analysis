name: 保活（防 60 天自动禁用定时任务）

on:
  schedule:
    - cron: '17 3 1 * *'      # 每月 1 号 UTC 03:17 = 北京 11:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 生成空提交，保持仓库活跃
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
